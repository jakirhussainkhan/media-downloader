[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "media-downloader"
version = "1.0.0"
description = "Self-hosted web app for downloading media from YouTube, Facebook, Instagram, TikTok, X (Twitter) and Pinterest."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "yt-dlp>=2025.1.1",
    "mutagen>=1.45.0",
    "python-multipart>=0.0.18",
    "pystray>=0.6.0",
    "pillow>=10.0.0",
]

[tool.setuptools]
py-modules = ["app_paths", "downloader", "launcher", "main", "version"]
